# Pile de production, telle qu'elle tourne sur le VPS.
#
#     docker compose up -d
#
# ⚠️ **Aucun service ne prend les ports 80 ni 443.** Le VPS fait tourner
# HestiaCP avec nginx, qui sert deja vformations.fr sur ces ports. Un
# conteneur qui les reclamerait ferait tomber le site. `web` n'ecoute donc
# que sur 127.0.0.1 : c'est nginx qui l'expose, en mandataire, sur le
# sous-domaine du back-office, avec le certificat gere par Hestia.
#
# Pour un serveur nu, sans panneau ni nginx, ajouter Caddy :
#     docker compose -f compose.yaml -f compose.autonome.yaml up -d
#
# Les images sont epinglees sur une version majeure : une mise a jour se
# decide, elle ne s'impose pas au redemarrage.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    # Sur 127.0.0.1 seulement : rien ne doit joindre gunicorn sans passer
    # par nginx, qui porte le TLS et les en-tetes de securite.
    ports: ["127.0.0.1:${PORT_WEB:-8000}:8000"]
    # Les migrations passent avant que gunicorn n'accepte une requete :
    # un demarrage ne doit jamais servir un schema en retard.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
                      --access-logfile - --error-logfile -"
    volumes:
      - media:/app/media
      - statiques:/app/staticfiles
    healthcheck:
      # Interroge l'application, pas le port : un gunicorn qui accepte la
      # connexion mais ne peut pas joindre PostgreSQL n'est pas « sain ».
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/sante/', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  # File par defaut : webhooks, envois, taches courtes.
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["celery", "-A", "config", "worker", "--queues", "celery", "--loglevel=info"]
    volumes:
      - media:/app/media
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  # ⚠️ File « siren », UN SEUL consommateur, UNE SEULE execution a la fois.
  # L'API Recherche d'entreprises plafonne a 7 requetes/seconde par adresse
  # IP et sa specification previent que les cloud publics l'atteignent. Un
  # compteur dans le code serait faux des qu'un second worker demarrerait :
  # c'est la topologie des files qui tient la cadence, pas le code.
  # Ne jamais passer ce service a l'echelle ni augmenter sa concurrence.
  worker-siren:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["celery", "-A", "config", "worker",
              "--queues", "siren", "--concurrency", "1", "--loglevel=info"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  beat:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]
    depends_on:
      redis: {condition: service_healthy}

volumes:
  pgdata:
  redisdata:
  media:
  statiques:
