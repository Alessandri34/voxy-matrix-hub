[project]
name = "backoffice"
version = "0.1.0"
description = "Back-office du centre de formation — CRM, financement, administratif Qualiopi"
requires-python = ">=3.13"

# Toutes les versions sont epinglees : une reconstruction de l'image six mois
# plus tard doit produire la meme stack, sinon le deploiement devient un pari.
dependencies = [
  "Django==5.2.19",          # derniere LTS (le cycle LTS est en x.2 : 4.2, 5.2, puis 6.2)
  "psycopg[binary]==3.3.8",  # pilote PostgreSQL officiel, version 3
  "django-environ==0.14.0",  # lit le .env, typage et valeurs par defaut
  "celery==5.7.0",
  "redis==8.1.0",
  "django-otp==1.7.5",       # 2FA : TOTP + integration admin, sans dependance lourde
  "qrcode==8.2",             # QR d'enrolement de l'application d'authentification
  "gunicorn==26.2.0",
  "whitenoise==6.12.0",      # fichiers statiques servis par Django, pas de volume partage
  # Client HTTP pour l'API Recherche d'entreprises. httpx plutot que requests :
  # ses delais d'attente sont obligatoires par defaut. requests n'en pose aucun,
  # et un appel suspendu bloquerait un worker Celery indefiniment.
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-django==4.14.0",
  "ruff==0.17.4",
]

[tool.setuptools]
packages = ["config", "apps"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
# Django ecrit les migrations lui-meme et les reecrira : on ne discute pas
# la longueur de ses lignes, mais on garde les erreurs reelles (F).
"**/migrations/*.py" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
testpaths = ["apps", "tests"]
