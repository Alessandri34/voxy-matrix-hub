<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>{% block titre %}Pipeline{% endblock %} — Back-office VFormations</title>
{# Favicon inline : evite un 404 par page dans le journal du serveur. #}
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%231f6feb'/><path d='M4 5h2.2l1.8 4.6L9.8 5H12l-3 7H7z' fill='white'/></svg>">
<style>
  /* Aucune dependance externe : pas de CDN, pas de cadre JavaScript. Le
     back-office doit s'ouvrir meme quand le reseau sortant est coupe. */
  :root{
    --fond:#f6f7f9; --carte:#fff; --trait:#dfe3e8; --texte:#1c2024;
    --doux:#5b6471; --accent:#1f6feb; --alerte:#b42318; --succes:#067647;
    --attention:#b54708;
  }
  @media (prefers-color-scheme:dark){
    :root{--fond:#15181c;--carte:#1d2126;--trait:#2d333b;--texte:#e6e9ee;
      --doux:#9aa4b2;--accent:#5a9bff;--alerte:#ff7b72;--succes:#3fb950;
      --attention:#d29922;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fond);color:var(--texte);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;flex-wrap:wrap;gap:1rem;align-items:baseline;
    padding:1rem 1.25rem;border-bottom:1px solid var(--trait);background:var(--carte)}
  header h1{font-size:1.05rem;margin:0;font-weight:650}
  nav{display:flex;gap:.75rem;margin-left:auto;flex-wrap:wrap}
  nav a{color:var(--accent);text-decoration:none;font-size:.9rem}
  nav a:hover{text-decoration:underline}
  .badge{display:inline-block;padding:.1rem .45rem;border-radius:99px;
    font-size:.75rem;font-weight:600;background:var(--fond);border:1px solid var(--trait)}
  .badge.alerte{background:#fef3f2;border-color:#fda29b;color:var(--alerte)}
  @media (prefers-color-scheme:dark){.badge.alerte{background:#2d1a18;border-color:#5c2622}}
  main{padding:1.25rem}
  .vide{color:var(--doux);font-size:.9rem;padding:.5rem 0}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th,td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--trait);
    vertical-align:top}
  th{font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:var(--doux)}
  h2{font-size:.95rem;margin:1.75rem 0 .5rem}
  h2:first-of-type{margin-top:0}
  code{font-size:.85em;background:var(--fond);padding:.05rem .3rem;border-radius:3px}
  {% block style %}{% endblock %}
</style>
</head>
<body>
<header>
  <h1>Back-office VFormations</h1>
  <nav>
    <a href="{% url 'pipeline:kanban' %}">Pipeline</a>
    <a href="{% url 'pipeline:leads' %}">Leads</a>
    <a href="{% url 'pipeline:financement' %}">Financement</a>
    <a href="/admin/">Administration</a>
  </nav>
</header>
<main>{% block contenu %}{% endblock %}</main>
{% block script %}{% endblock %}
</body>
</html>
