name: Diagnostic du VPS

# Se déclenche à la poussée de ce fichier. Commandes en lecture seule.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/new-session-nefcch
    paths:
      - '.github/workflows/diagnostic-vps.yml'

jobs:
  diagnostic:
    name: Inspecter l'état du serveur
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Installer la clé
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/k
          chmod 600 ~/.ssh/k

      - name: Inspecter
        run: |
          timeout 180 ssh -i ~/.ssh/k -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'timeout 150 bash -s' <<'REMOTE'
          echo "######## A. PANNEAU DE CONTROLE ########"
          for b in /usr/local/hestia/bin/v-list-web-domains /usr/local/vesta/bin/v-list-web-domains; do
            [ -x "$b" ] && echo "  trouve : $b"
          done
          [ -d /usr/local/hestia ] && echo "  HestiaCP present" || echo "  pas de HestiaCP"
          echo
          echo "######## B. DOMAINES WEB DU PANNEAU ########"
          ls -1 /home/*/web/ 2>/dev/null | sed 's/^/  /' || echo "  (aucun)"
          echo
          echo "######## C. UTILISATEUR PROPRIETAIRE ########"
          ls -ld /home/*/web 2>/dev/null | sed 's/^/  /'
          echo
          echo "######## D. OU NGINX INCLUT SES CONFIGS ########"
          grep -hE '^\s*include' /etc/nginx/nginx.conf 2>/dev/null | sed 's/^/  /'
          echo
          echo "######## E. CONF DU DOMAINE vformations ########"
          find /etc/nginx /home/*/conf 2>/dev/null -name '*vformations*' | sed 's/^/  /' || echo "  aucune"
          echo
          echo "######## F. LE DOSSIER PANNEAU EXISTE-T-IL DEJA ? ########"
          ls -la /home/*/web/vformations.fr/ 2>/dev/null | head -5 || echo "  non, domaine pas encore ajoute au panneau"
          echo
          echo "######## G. CONTENU SERVI AUJOURD HUI ########"
          echo "  taille document_errors :"
          ls -la /var/www/document_errors/ 2>/dev/null | head -6 | sed 's/^/    /'
          echo "######## FIN ########"
          REMOTE
