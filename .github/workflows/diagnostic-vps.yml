name: Diagnostic du VPS

# Se déclenche à la poussée de ce fichier. Commandes en lecture seule.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/new-session-nefcch
    paths:
      - '.github/workflows/diagnostic-vps.yml'

jobs:
  diagnostic:
    name: Inspecter l'état du serveur
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Installer la clé
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/k
          chmod 600 ~/.ssh/k

      - name: Inspecter
        run: |
          timeout 180 ssh -i ~/.ssh/k -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'timeout 150 bash -s' <<'REMOTE'
          set -u
          echo "######## 1. SAUVEGARDE DE /etc/nginx ########"
          BK=/var/backups/nginx-avant-vformations-$(date +%Y%m%d-%H%M%S).tar.gz
          mkdir -p /var/backups
          tar czf "$BK" /etc/nginx 2>/dev/null && echo "  sauvegarde : $BK ($(du -h "$BK" | cut -f1))"
          ls -1t /var/backups/nginx-avant-vformations-*.tar.gz 2>/dev/null | head -3 | sed 's/^/    /'
          echo
          echo "######## 2. ETAT DE REFERENCE DES 8 DOMAINES ########"
          for d in antiplanity.fr ai.antiplanity.fr auto.antiplanity.fr furnished.antiplanity.fr timeclean.antiplanity.fr voxy.antiplanity.fr sabriperformance.com srv1332415.hstgr.cloud; do
            c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 6 -H "Host: $d" http://127.0.0.1/ 2>/dev/null || echo ERR)
            printf "  %-28s HTTP %s\n" "$d" "$c"
          done
          echo
          echo "######## 3. OU EST LE BLOC CERTBOT ? ########"
          grep -rln 'vformations' /etc/nginx/ 2>/dev/null | sed 's/^/  fichier: /' || echo "  aucun fichier"
          echo
          echo "######## 4. CONTEXTE EXACT (20 lignes autour) ########"
          for f in $(grep -rln 'vformations' /etc/nginx/ 2>/dev/null); do
            echo "  ===== $f ====="
            grep -n 'vformations' "$f" | sed 's/^/    ligne /'
            echo "    --- extrait ---"
            n=$(grep -n 'vformations' "$f" | head -1 | cut -d: -f1)
            sed -n "$((n>12?n-12:1)),$((n+8))p" "$f" | cat -A | sed 's/\$$//' | sed 's/^/    /' | head -24
          done
          echo
          echo "######## 5. CERTIFICATS LET SENCRYPT ########"
          ls -1 /etc/letsencrypt/live/ 2>/dev/null | sed 's/^/  /' || echo "  aucun"
          echo
          echo "######## 6. FICHIERS HESTIA DU DOSSIER domains ########"
          ls -1 /etc/nginx/conf.d/domains/ 2>/dev/null | sed 's/^/  /' | head -20
          echo
          echo "######## 7. CONFIG INUTILE CREEE A L ETAPE 2 ########"
          ls -la /etc/nginx/sites-available/ 2>/dev/null | sed 's/^/  /' || echo "  (absent)"
          echo "######## FIN ########"
          REMOTE
