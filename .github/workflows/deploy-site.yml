name: Déployer le site VFormations

# Deux déclencheurs :
#  - push sur la branche de travail, quand un fichier du site change.
#    (Le bouton "Run workflow" n'apparaît dans l'onglet Actions que si le
#     fichier existe sur la branche par défaut — ce n'est pas notre cas.)
#  - déclenchement manuel, utilisable une fois le workflow sur main.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/new-session-nefcch
    paths:
      - 'livrables/C-site/site.html'
      - 'livrables/C-site/img/**'
      - '.github/workflows/deploy-site.yml'

jobs:
  deploy:
    name: Construire et déployer sur le VPS
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Construire le paquet
        run: |
          mkdir -p dist/img
          cp livrables/C-site/site.html dist/index.html
          cp livrables/C-site/img/*.png dist/img/
          cp livrables/C-site/img/*.jpg dist/img/
          cp livrables/C-site/api/contact.php dist/
          echo "Paquet construit :"
          find dist -type f | sort

      - name: Contrôle légal avant publication
        run: |
          if grep -qE "à compléter|\[à confirmer\]" dist/index.html; then
            echo "::error::Des champs légaux obligatoires sont encore à compléter — déploiement interrompu."
            grep -nE "à compléter|\[à confirmer\]" dist/index.html
            exit 1
          fi
          echo "Aucun champ légal manquant."

      - name: Avertissement formulaire de contact
        run: |
          if grep -q "var FORM_ENDPOINT = '';" dist/index.html; then
            echo "::warning::Le formulaire de contact n'est pas branché : les demandes ne seront pas envoyées."
          fi

      - name: Installer la clé de déploiement
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Déterminer la racine web gérée par Hestia
        id: cible
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          HU=$($SSH "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'for d in /home/*/; do [ -d "${d}web" ] && basename "$d" && break; done')
          if [ -z "$HU" ]; then
            echo "::error::Utilisateur Hestia introuvable sur le serveur."
            exit 1
          fi
          RACINE="/home/$HU/web/vformations.fr/public_html"
          if ! $SSH "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "[ -d '$RACINE' ]"; then
            echo "::error::$RACINE n'existe pas — le domaine n'est pas déclaré dans Hestia."
            exit 1
          fi
          echo "utilisateur=$HU" >> "$GITHUB_OUTPUT"
          echo "racine=$RACINE" >> "$GITHUB_OUTPUT"
          echo "Cible : $RACINE (utilisateur $HU)"

      - name: Envoyer les fichiers sur le VPS
        run: |
          rsync -avz --delete \
            --exclude '.well-known' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            dist/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ steps.cible.outputs.racine }}/"

      - name: Corriger les droits et recharger nginx
        run: |
          HU="${{ steps.cible.outputs.utilisateur }}"
          RACINE="${{ steps.cible.outputs.racine }}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "set -e
             PRIVE=\"\$(dirname '$RACINE')/private\"
             mkdir -p \"\$PRIVE\"
             chown -R $HU:$HU '$RACINE' \"\$PRIVE\"
             chmod 750 \"\$PRIVE\"
             find '$RACINE' -type d -exec chmod 755 {} +
             find '$RACINE' -type f -exec chmod 644 {} +
             nginx -t && systemctl reload nginx"

      - name: Vérifier que le site répond
        run: |
          sleep 3
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://vformations.fr" || echo "000")
          echo "Réponse de https://vformations.fr : HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Le site ne répond pas encore en 200 (DNS ou certificat peut-être pas prêt)."
          fi
