name: Déployer le site VFormations

# Deux déclencheurs :
#  - push sur la branche de travail, quand un fichier du site change.
#    (Le bouton "Run workflow" n'apparaît dans l'onglet Actions que si le
#     fichier existe sur la branche par défaut — ce n'est pas notre cas.)
#  - déclenchement manuel, utilisable une fois le workflow sur main.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/new-session-nefcch
    paths:
      - 'livrables/C-site/site.html'
      - 'livrables/C-site/pages.json'
      - 'livrables/C-site/build.mjs'
      - 'livrables/C-site/api/contact.php'
      - 'livrables/C-site/img/**'
      - '.github/workflows/deploy-site.yml'

jobs:
  deploy:
    name: Construire et déployer sur le VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Le site source est un fichier unique à routage par ancres (#slug) :
      # une seule URL pour 31 pages, donc une seule page indexable.
      # build.mjs l'éclate en 31 pages HTML autonomes, chacune avec son
      # titre, sa meta description, son canonical et son Schema.org.
      - name: Construire le site statique
        working-directory: livrables/C-site
        run: |
          node build.mjs
          echo "--- arborescence produite ---"
          find dist -maxdepth 2 -type d | sort

      - name: Contrôle légal avant publication
        working-directory: livrables/C-site
        run: |
          if grep -rqE "à compléter|\[à confirmer\]" dist --include='*.html'; then
            echo "::error::Des champs légaux obligatoires sont encore à compléter — déploiement interrompu."
            grep -rnE "à compléter|\[à confirmer\]" dist --include='*.html' | head -20
            exit 1
          fi
          echo "Aucun champ légal manquant."

      # Un titre dupliqué ou un sitemap cassé annule tout le bénéfice du
      # découpage en pages. Ces contrôles bloquent le déploiement.
      - name: Contrôle SEO avant publication
        working-directory: livrables/C-site
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, existsSync } from 'node:fs';
          import { join } from 'node:path';
          const pages = JSON.parse(readFileSync('pages.json', 'utf8'));
          const titres = new Set(), canons = new Set();
          let pb = 0;
          const err = m => { console.log(`::error::${m}`); pb++; };
          for (const [slug, chemin] of pages) {
            const f = join('dist', chemin, 'index.html');
            if (!existsSync(f)) { err(`page manquante : ${chemin}`); continue; }
            const h = readFileSync(f, 'utf8');
            const t = (h.match(/<title>([^<]*)<\/title>/) || [])[1];
            const c = (h.match(/rel="canonical" href="([^"]*)"/) || [])[1];
            const d = (h.match(/name="description" content="([^"]*)"/) || [])[1];
            if (!t) err(`titre absent : ${chemin}`);
            else if (titres.has(t)) err(`titre dupliqué : "${t}"`);
            else titres.add(t);
            if (!c) err(`canonical absent : ${chemin}`);
            else if (canons.has(c)) err(`canonical dupliqué : ${c}`);
            else canons.add(c);
            if (!d) err(`meta description absente : ${chemin}`);
            if (h.indexOf('data-page="' + slug + '"') === -1) err(`section ${slug} absente de ${chemin}`);
            const ld = (h.match(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/) || [])[1];
            if (!ld) err(`Schema.org absent : ${chemin}`);
            else { try { JSON.parse(ld); } catch (e) { err(`Schema.org invalide (${chemin}) : ${e.message}`); } }
          }
          const sm = readFileSync('dist/sitemap.xml', 'utf8');
          const urls = [...sm.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m => m[1]);
          if (urls.length !== pages.length) err(`sitemap : ${urls.length} URLs pour ${pages.length} pages`);
          for (const u of urls) if (!u.startsWith('https://vformations.fr')) err(`URL hors domaine dans le sitemap : ${u}`);
          if (!readFileSync('dist/robots.txt', 'utf8').includes('Sitemap:')) err('robots.txt sans ligne Sitemap');
          if (pb) { console.log(`${pb} problème(s) SEO — déploiement interrompu.`); process.exit(1); }
          console.log(`Contrôle SEO : ${pages.length} pages, ${titres.size} titres uniques, ${urls.length} URLs au sitemap. OK.`);
          JS

      - name: Avertissement formulaire de contact
        working-directory: livrables/C-site
        run: |
          if ! grep -q "FORM_ENDPOINT = '/contact.php'" dist/assets/app.js; then
            echo "::warning::Le formulaire ne pointe pas sur /contact.php — vérifier la réception des demandes."
          fi
          if [ ! -f dist/contact.php ]; then
            echo "::error::dist/contact.php est absent : le formulaire ne pourra rien enregistrer."
            exit 1
          fi

      - name: Installer la clé de déploiement
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Déterminer la racine web gérée par Hestia
        id: cible
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          HU=$($SSH "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'for d in /home/*/; do [ -d "${d}web" ] && basename "$d" && break; done')
          if [ -z "$HU" ]; then
            echo "::error::Utilisateur Hestia introuvable sur le serveur."
            exit 1
          fi
          RACINE="/home/$HU/web/vformations.fr/public_html"
          if ! $SSH "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "[ -d '$RACINE' ]"; then
            echo "::error::$RACINE n'existe pas — le domaine n'est pas déclaré dans Hestia."
            exit 1
          fi
          echo "utilisateur=$HU" >> "$GITHUB_OUTPUT"
          echo "racine=$RACINE" >> "$GITHUB_OUTPUT"
          echo "Cible : $RACINE (utilisateur $HU)"

      # --delete nettoie les anciens fichiers, mais ni .well-known (certbot)
      # ni private/ (le CSV des demandes, qui est hors public_html mais dont
      # on se garde de toucher le voisinage).
      - name: Envoyer les fichiers sur le VPS
        working-directory: livrables/C-site
        run: |
          rsync -avz --delete \
            --exclude '.well-known' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            dist/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ steps.cible.outputs.racine }}/"

      - name: Corriger les droits et recharger nginx
        run: |
          HU="${{ steps.cible.outputs.utilisateur }}"
          RACINE="${{ steps.cible.outputs.racine }}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "set -e
             PRIVE=\"\$(dirname '$RACINE')/private\"
             mkdir -p \"\$PRIVE\"
             chown -R $HU:$HU '$RACINE' \"\$PRIVE\"
             chmod 750 \"\$PRIVE\"
             find '$RACINE' -type d -exec chmod 755 {} +
             find '$RACINE' -type f -exec chmod 644 {} +
             nginx -t && systemctl reload nginx"

      # On ne vérifie pas que "le site répond" : on vérifie que chaque URL
      # du sitemap répond 200 et que les titres sont bien différents en ligne.
      - name: Vérifier les URLs en production
        working-directory: livrables/C-site
        run: |
          sleep 5
          ECHECS=0
          while read -r u; do
            code=$(curl -s -o /tmp/p.html -w "%{http_code}" --max-time 20 "$u" || echo 000)
            titre=$(grep -o '<title>[^<]*</title>' /tmp/p.html 2>/dev/null | head -1 | sed 's/<[^>]*>//g')
            printf "  %-58s %s  %s\n" "${u#https://vformations.fr}" "$code" "${titre:0:40}"
            [ "$code" = "200" ] || ECHECS=$((ECHECS+1))
          done < <(grep -o '<loc>[^<]*</loc>' dist/sitemap.xml | sed 's/<[^>]*>//g')
          for f in /sitemap.xml /robots.txt; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://vformations.fr$f" || echo 000)
            echo "  $f → HTTP $code"
            [ "$code" = "200" ] || ECHECS=$((ECHECS+1))
          done
          if [ $ECHECS -gt 0 ]; then
            echo "::error::$ECHECS URL(s) ne répondent pas correctement."
            exit 1
          fi
          echo "Toutes les URLs répondent 200."
