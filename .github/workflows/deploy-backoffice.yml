name: Déployer le back-office

# Déclenchement MANUEL seulement, délibérément.
#
# Le site vitrine se déploie automatiquement : il est statique, et une
# mauvaise version se corrige en reposant la précédente. Le back-office,
# lui, applique des migrations de base de données sur des données de
# prospects. Une migration ne se « repose » pas. La première mise en
# production se fait sous les yeux de quelqu'un.
#
# Le déclenchement sur push pourra être ajouté quand plusieurs
# déploiements se seront bien passés et que la sauvegarde nocturne aura
# été restaurée au moins une fois pour de vrai.
on:
  workflow_dispatch:
    inputs:
      confirmer:
        description: "Taper DEPLOYER pour confirmer"
        required: true
        default: ""

jobs:
  verifier:
    name: La suite de tests doit être verte
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install . ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - name: Style
        run: |
          ruff check .
          ruff format --check .

      # Un réglage de production affaibli passe les tests sans bruit.
      - name: Contrôles de déploiement Django
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          SECRET_KEY: cle-de-controle-uniquement-jamais-utilisee-en-production-2026
          ALLOWED_HOSTS: backoffice.vformations.fr
          DATABASE_URL: postgres://u:p@localhost:5432/d
          REDIS_URL: redis://localhost:6379/0
        run: |
          SORTIE=$(python manage.py check --deploy --fail-level WARNING 2>&1) || true
          echo "$SORTIE"
          # W009 ne concerne que la clé bidon ci-dessus : la vraie est dans
          # le .env du serveur et n'entre jamais dans ce dépôt.
          if echo "$SORTIE" | grep -oE '\(security\.W[0-9]+\)' | grep -v 'W009'; then
            echo "::error::Un contrôle de sécurité Django échoue — déploiement interrompu."
            exit 1
          fi
          echo "Aucun avertissement de sécurité autre que la clé de contrôle."

  deployer:
    name: Déployer sur le VPS
    needs: verifier
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Vérifier la confirmation
        if: inputs.confirmer != 'DEPLOYER'
        run: |
          echo "::error::Confirmation absente. Relancer en tapant DEPLOYER."
          exit 1

      - uses: actions/checkout@v4

      - name: Préparer la clé SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      # Le déploiement ne crée rien : il refuse de tourner tant que la
      # première installation (manuelle, documentée) n'a pas été faite.
      # Créer un .env vide ici donnerait une pile qui démarre sans secrets.
      - name: Vérifier que la première installation est faite
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          CIBLE="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          $SSH "$CIBLE" 'set -e
            [ -d /opt/backoffice ]      || { echo "::error::/opt/backoffice absent — voir deploiement/premiere-installation.md"; exit 1; }
            [ -f /opt/backoffice/.env ] || { echo "::error::/opt/backoffice/.env absent — les secrets ne sont jamais déployés depuis le dépôt"; exit 1; }
            command -v docker >/dev/null || { echo "::error::docker absent du serveur"; exit 1; }
            echo "Première installation en place."'

      # Garde-fou : le back-office ne doit jamais prendre 80 ni 443, que
      # nginx occupe pour vformations.fr. Un compose qui les réclamerait
      # ferait tomber le site vitrine.
      - name: Refuser toute prise des ports 80 et 443
        run: |
          if grep -nE '^\s*(ports:.*\b(80|443)\b|- *"?(80|443):)' compose.yaml; then
            echo "::error::compose.yaml réclame le port 80 ou 443 — cela ferait tomber vformations.fr."
            exit 1
          fi
          echo "Aucun service ne réclame 80 ni 443."

      - name: Envoyer le code
        run: |
          rsync -az --delete \
            --exclude '.env' --exclude '__pycache__' --exclude '.venv' \
            --exclude 'staticfiles' --exclude 'media' --exclude '*.sqlite3' \
            --exclude '.git' --exclude '.github' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/backoffice/"

      - name: Sauvegarder la base avant migration
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          $SSH "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'set -e
            cd /opt/backoffice
            # Une migration ne se défait pas : le filet est pris AVANT, pas
            # après. Si la pile ne tourne pas encore, il n’y a rien à sauver.
            if docker compose ps --status running --quiet db | grep -q .; then
              mkdir -p /var/backups/backoffice
              HORO=$(date +%Y%m%d-%H%M%S)
              docker compose exec -T db pg_dump -U "$(grep -E "^POSTGRES_USER=" .env | cut -d= -f2)" \
                "$(grep -E "^POSTGRES_DB=" .env | cut -d= -f2)" \
                | gzip > "/var/backups/backoffice/avant-deploiement-$HORO.sql.gz"
              echo "Sauvegarde : /var/backups/backoffice/avant-deploiement-$HORO.sql.gz"
              ls -1t /var/backups/backoffice/avant-deploiement-*.sql.gz | tail -n +11 | xargs -r rm --
            else
              echo "Pile non démarrée : premier déploiement, rien à sauvegarder."
            fi'

      - name: Construire, démarrer, vérifier
        id: demarrage
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          $SSH "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'set -e
            cd /opt/backoffice

            # Les images actuelles sont étiquetées avant la construction :
            # c’est ce qui rend le retour arrière possible en une commande.
            for s in web worker worker-siren beat; do
              ID=$(docker compose images -q "$s" 2>/dev/null | head -1)
              [ -n "$ID" ] && docker tag "$ID" "backoffice-$s:precedent" || true
            done

            docker compose build
            docker compose up -d --remove-orphans

            echo "Attente du point de santé (90 s au plus)…"
            for i in $(seq 1 45); do
              if curl -fsS --max-time 5 http://127.0.0.1:8000/sante/ | grep -q "\"etat\": \"ok\""; then
                echo "Application saine après $((i*2)) s."
                exit 0
              fi
              sleep 2
            done
            echo "::error::Le point de santé ne répond pas « ok » après 90 s."
            docker compose ps
            docker compose logs --tail=60 web
            exit 1'

      - name: Retour arrière si le démarrage a échoué
        if: failure() && steps.demarrage.outcome == 'failure'
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          $SSH "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'set +e
            cd /opt/backoffice
            echo "Retour aux images précédentes."
            for s in web worker worker-siren beat; do
              docker image inspect "backoffice-$s:precedent" >/dev/null 2>&1 \
                && docker tag "backoffice-$s:precedent" "backoffice-$s:latest"
            done
            docker compose up -d --no-build
            sleep 10
            curl -fsS --max-time 5 http://127.0.0.1:8000/sante/ || true
            echo
            echo "⚠️  Le CODE est revenu en arrière. Une migration déjà appliquée,"
            echo "    elle, ne se défait pas : vérifier l’état de la base, et au"
            echo "    besoin restaurer la sauvegarde prise juste avant, avec"
            echo "    scripts/restore.sh."'
          echo "::error::Déploiement échoué, images précédentes remises. Voir le message ci-dessus."
          exit 1

      - name: Ce que la pile fait tourner
        if: success()
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cd /opt/backoffice && docker compose ps --format "table {{.Service}}\t{{.Status}}"
             echo
             echo "Files Celery consommées :"
             docker compose exec -T worker celery -A config inspect active_queues 2>/dev/null \
               | grep -E "queue|name" | head -10 || echo "  (worker non interrogeable)"'
